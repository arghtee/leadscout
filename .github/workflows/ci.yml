name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leadscout
          POSTGRES_PASSWORD: leadscout
          POSTGRES_DB: leadscout
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U leadscout" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Run tests
        env:
          TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql+psycopg://leadscout:leadscout@localhost:5432/leadscout' || '' }}
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=80

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t leadscout:ci .
